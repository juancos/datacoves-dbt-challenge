version: 2

seeds:
  - name: customers
    columns:
      - name: customer_id
        data_tests:
          - unique
          - not_null
      - name: customer_name
        data_tests:
          - not_null

  - name: orders
    columns:
      - name: order_id
        data_tests:
          - unique
          - not_null
      - name: customer_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('customers')
                field: customer_id
      - name: status
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['completed', 'cancelled']

  - name: payments
    columns:
      - name: payment_id
        data_tests:
          - unique
          - not_null
      - name: order_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('orders')
                field: order_id
      - name: payment_type
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['charge', 'refund']
      - name: amount
        data_tests:
          - not_null

models:
  - name: fct_order_net_collections
    description: >
      One row per completed order. Net collections equal charges
      minus refunds, attributed to the order date.
      Amounts are synthetic USD values, not recognized accounting revenue.
    columns:
      - name: order_id
        data_tests:
          - unique
          - not_null
      - name: customer_id
        data_tests:
          - not_null
      - name: customer_name
        data_tests:
          - not_null
      - name: net_collected_amount
        data_tests:
          - not_null
      - name: status
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['completed']
